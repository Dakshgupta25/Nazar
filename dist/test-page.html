<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAZAR Test Harness — Phase 1</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #0284c7;
      --danger: #f43f5e;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1, h2, h3 {
      color: #38bdf8;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      border-radius: 4px;
      font-size: 12px;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-muted);
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #090d16;
      color: var(--text);
      font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .row .form-group {
      flex: 1;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .sensitive-tag {
      color: #fda4af;
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <h1>NAZAR Extension Test Bed</h1>
  <div class="badge">Phase 1: Verification Page for DOM Extraction & Screen Capture</div>
  <p>
    This synthetic page contains standard and sensitive form fields for verifying the NAZAR privacy boundary capture mechanism without exposing real personal data.
  </p>

  <div class="card">
    <h2>Synthetic Registration Form</h2>
    <form id="test-registration-form" action="#" onsubmit="event.preventDefault();">
      <div class="row">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" value="Synthetic User" />
        </div>
        <div class="form-group">
          <label for="email">Email Address <span class="sensitive-tag">[Sensitive Candidate]</span></label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" value="test-privacy@example.org" />
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="phone">Phone Number <span class="sensitive-tag">[Sensitive Candidate]</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+1-555-0199" value="+1-555-0142" />
        </div>
        <div class="form-group">
          <label for="password">Account Password <span class="sensitive-tag">[Sensitive Candidate]</span></label>
          <input type="password" id="password" name="password" value="SuperSecretPassword123!" />
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="creditCardNumber">Credit Card Number <span class="sensitive-tag">[Sensitive Candidate]</span></label>
          <input type="text" id="creditCardNumber" name="creditCardNumber" placeholder="4000 1234 5678 9010" value="4000-0000-0000-0000" />
        </div>
        <div class="form-group">
          <label for="cardCvv">CVV <span class="sensitive-tag">[Sensitive Candidate]</span></label>
          <input type="password" id="cardCvv" name="cardCvv" maxlength="4" value="999" style="max-width: 120px;" />
        </div>
      </div>

      <div class="form-group">
        <label for="apiKey">API Key / Auth Token <span class="sensitive-tag">[Sensitive Candidate]</span></label>
        <input type="text" id="apiKey" name="apiKey" value="naz_live_99a8b7c6d5e4f3a2b1" />
      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="US">United States</option>
          <option value="IN" selected>India</option>
          <option value="UK">United Kingdom</option>
          <option value="DE">Germany</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Public Feedback / Notes</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Public comments that can be safely seen by AI agents..."></textarea>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 20px;">
        <button type="submit" id="btn-submit" class="btn btn-primary">Submit Test Form</button>
        <button type="reset" id="btn-reset" class="btn btn-secondary">Reset Form</button>
      </div>
    </form>
  </div>
</body>
</html>
