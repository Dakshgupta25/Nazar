openapi: 3.0.3
info:
  title: Nazar Privacy Infrastructure for AI Agents
  description: Commercial API for privacy-preserving visual agent actions. The API enforces strict privacy by accepting ONLY sanitized payloads (PVS Redaction Schema).
  version: 1.0.0
servers:
  - url: https://api.nazar.dev/v1
    description: Production Server
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: NAZAR_API_KEY
  schemas:
    PVSRedactionPayload:
      type: object
      required:
        - schema
        - task
        - policy
      properties:
        schema:
          type: string
          example: nazar/pvs-redact/1.0
        task:
          type: string
          description: The instruction the agent is trying to accomplish.
          example: Find the submit button and click it
        screen:
          type: object
          properties:
            image:
              type: string
              description: Base64 encoded SANITIZED image.
        semantic_tree:
          type: object
          description: The sanitized DOM semantic tree.
        policy:
          type: object
          required:
            - residual_scan_passed
          properties:
            residual_scan_passed:
              type: boolean
              example: true
    ActionResponse:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          example: click
        target:
          type: string
          example: el_17
        confidence:
          type: number
          format: float
          example: 0.96

paths:
  /act:
    post:
      summary: Resolve task to an action using a sanitized visual context.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PVSRedactionPayload'
      responses:
        '200':
          description: Structured action payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '403':
          description: Payload failed strict privacy policy (e.g. residual scan failed).
