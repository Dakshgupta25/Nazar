<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nazar Edge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./popup.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1 class="brand">◉ NAZAR</h1>
    <button class="settings-btn" aria-label="Settings">⚙</button>
  </header>

  <!-- Protection Status -->
  <section class="status-section">
    <h2 class="status-title">PROTECTED</h2>
    <p class="status-desc">This page is being protected</p>
  </section>

  <hr class="divider">

  <!-- Metrics Block -->
  <section class="metrics-section">
    <div class="metric-row">
      <span class="metric-value">07</span>
      <span class="metric-label">sensitive regions protected</span>
    </div>
    <div class="metric-row">
      <span class="metric-value">03</span>
      <span class="metric-label">faces masked</span>
    </div>
    <div class="metric-row">
      <span class="metric-value">04</span>
      <span class="metric-label">PII fields secured</span>
    </div>
    <div class="metric-row highlight-metric">
      <span class="metric-value">00</span>
      <span class="metric-label">bytes of raw PII sent</span>
    </div>
  </section>

  <!-- Privacy Shield Quick Toggle -->
  <section class="shield-section">
    <div class="shield-toggle">
      <div class="control-radio active"></div>
      <span class="shield-label">Live Privacy Shield</span>
    </div>
  </section>

  <hr class="divider">

  <!-- System States -->
  <section class="system-section">
    <div class="system-row">
      <span class="system-label">Agent Mode</span>
      <span class="system-status active">ON</span>
    </div>
    <div class="system-row">
      <span class="system-label">Local Vision</span>
      <span class="system-status active">Ready</span>
    </div>
    <div class="system-row">
      <span class="system-label">Cloud Reasoning</span>
      <span class="system-status pending">Standby</span>
    </div>
  </section>

  <!-- Action -->
  <footer class="action-footer">
    <button class="view-protection-btn">View Protection</button>
  </footer>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
